<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EA580C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Story Reader">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Story Reader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Lora:ital,wght@0,500;1,400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:'Nunito','Trebuchet MS',sans-serif;background:#FFF7ED;color:#431407;transition:background .4s,color .4s}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-thumb{background:#FED7AA;border-radius:3px}

/* ── Layout ── */
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
#header{flex-shrink:0;background:#EA580C;color:#fff;padding:12px 16px 12px;padding-top:max(12px,env(safe-area-inset-top));display:flex;align-items:center;justify-content:space-between;gap:10;box-shadow:0 3px 16px rgba(0,0,0,.2);z-index:200}
#header-left{display:flex;align-items:center;gap:10;min-width:0}
#header-right{display:flex;gap:8;flex-shrink:0}
#book-title{font-size:16px;font-weight:900;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:42vw}
#book-sub{font-size:11px;opacity:.85;font-weight:600}
#settings-panel{flex-shrink:0;background:#fff;border-bottom:2px solid #FED7AA;padding:14px 16px;display:flex;flex-wrap:wrap;gap:18;transition:background .4s;overflow-y:auto;max-height:45vh}
#settings-panel.hidden{display:none}
#main{flex:1;overflow:hidden;display:flex;flex-direction:column;min-height:0}

/* ── Library ── */
#library{flex:1;overflow-y:auto;padding:20px 16px 120px}
#library h2{font-family:'Lora',Georgia,serif;font-size:26px;font-weight:700;color:#EA580C;margin-bottom:4px}
#library .sub{font-size:13px;color:#9A3412;margin-bottom:20px}
#book-list{display:flex;flex-direction:column;gap:12px}
.book-card{background:#FFF7ED;border:2px solid #FED7AA;border-radius:20px;padding:16px 18px;display:flex;align-items:center;gap:14;box-shadow:0 2px 12px rgba(234,88,12,.1);cursor:pointer;transition:transform .15s,box-shadow .15s;-webkit-user-select:none;user-select:none}
.book-card:active{transform:scale(.98)}
.book-card .icon{font-size:42px;flex-shrink:0}
.book-card .info{flex:1;min-width:0}
.book-card .btitle{font-size:16px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.book-card .bmeta{font-size:12px;color:#9A3412;margin-top:3px}
.book-card .badge{display:inline-block;margin-top:6px;background:#EA580C;color:#fff;font-size:11px;font-weight:700;border-radius:20px;padding:2px 8px}
.book-card .del-btn{background:none;border:1.5px solid #FED7AA;border-radius:10px;color:#9A3412;font-size:16px;width:34px;height:34px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
#empty-lib{text-align:center;padding:48px 20px;color:#9A3412}
#empty-lib .em{font-size:64px;margin-bottom:16px}
#add-fab{position:fixed;bottom:max(90px,calc(90px + env(safe-area-inset-bottom)));right:20px;background:#EA580C;color:#fff;border-radius:24px;padding:14px 22px;font-size:16px;font-weight:800;cursor:pointer;box-shadow:0 6px 24px rgba(234,88,12,.5);display:flex;align-items:center;gap:8;z-index:50;border:none;font-family:inherit}
#add-fab input{display:none}

/* ── Reader ── */
#reader{flex:1;display:flex;flex-direction:column;min-height:0;overflow:hidden}
#page-content{flex:1;overflow-y:auto;padding:22px 20px 20px;background:#fff;margin:10px 10px 0;border-radius:20px 20px 0 0;box-shadow:0 -2px 20px rgba(0,0,0,.12);font-family:'Lora',Georgia,serif;line-height:1.9;color:#431407;transition:background .4s,color .4s;font-size:24px}
#page-nav{display:flex;align-items:center;justify-content:center;gap:14px;padding:8px 16px 4px;background:#fff;margin:0 10px;flex-shrink:0;transition:background .4s}
.nav-btn{background:#FED7AA;border:none;border-radius:20px;color:#EA580C;font-size:14px;font-weight:800;padding:7px 16px;cursor:pointer;font-family:inherit}
.nav-btn:disabled{opacity:.35;cursor:not-allowed}
#page-num{font-size:13px;color:#9A3412;font-weight:700}

/* ── Player bar ── */
#player{position:fixed;bottom:0;left:0;right:0;background:#EA580C;padding:10px 16px;padding-bottom:max(20px,calc(20px + env(safe-area-inset-bottom)));display:flex;align-items:center;justify-content:space-between;gap:10;z-index:100;box-shadow:0 -4px 24px rgba(0,0,0,.2)}
.c-btn{background:rgba(255,255,255,.18);border:none;border-radius:12px;color:#fff;font-size:22px;width:44px;height:44px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit;flex-shrink:0}
.c-btn:disabled{opacity:.3;cursor:not-allowed}
#player-center{display:flex;gap:10px;align-items:center;flex:1;justify-content:center}
#play-btn{background:#fff;border:none;border-radius:28px;color:#EA580C;font-size:16px;font-weight:900;padding:11px 22px;cursor:pointer;font-family:'Nunito',sans-serif;box-shadow:0 4px 14px rgba(0,0,0,.22);white-space:nowrap}
#words-badge{background:rgba(255,255,255,.2);border-radius:14px;padding:5px 10px;color:#fff;font-size:12px;font-weight:800;text-align:center;flex-shrink:0;min-width:44px}

/* ── Word highlight ── */
.word{cursor:pointer;border-radius:5px;transition:background .08s,color .08s;display:inline;line-height:1.9;padding:2px 1px}
.word.active{background:#FB923C;color:#fff;font-weight:800;padding:2px 5px}

/* ── Settings controls ── */
.setting-label{font-size:11px;font-weight:800;margin-bottom:7px;color:#EA580C;text-transform:uppercase;letter-spacing:.06em}
.speed-btns{display:flex;gap:6px;flex-wrap:wrap}
.speed-btn{padding:5px 10px;border-radius:20px;border:2px solid #FED7AA;background:transparent;color:#9A3412;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .2s}
.speed-btn.active{border-color:#EA580C;background:#EA580C;color:#fff}
.size-row{display:flex;gap:8px;align-items:center}
.size-btn{background:transparent;border:2px solid #FED7AA;border-radius:10px;color:#EA580C;font-size:14px;font-weight:800;padding:5px 10px;cursor:pointer;font-family:inherit}
#voice-select{background:#FFF7ED;border:2px solid #FED7AA;color:#431407;border-radius:12px;padding:7px 10px;font-size:13px;font-family:inherit;font-weight:600;width:100%;max-width:320px}
.voice-hint{font-size:11px;color:#9A3412;margin-top:5px}
#voice-wrap{width:100%}

/* ── Header buttons ── */
.hdr-btn{background:rgba(255,255,255,.2);border:none;border-radius:10px;color:#fff;font-size:20px;width:38px;height:38px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
#back-btn{display:none}

/* ── Loading / error ── */
#loading{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
#loading .spin{font-size:60px;animation:spin 1.2s linear infinite}
#loading .msg{font-size:20px;color:#EA580C;font-weight:800}
@keyframes spin{to{transform:rotate(360deg)}}
#error-box{margin:16px;background:#FEE2E2;color:#991B1B;border-radius:14px;padding:12px 16px;font-size:14px;line-height:1.5}
#error-box.hidden{display:none}

/* ── Tap hint ── */
#tap-hint{position:fixed;top:72px;right:12px;background:rgba(0,0,0,.72);color:#fff;border-radius:12px;padding:8px 12px;font-size:11px;max-width:160px;text-align:center;pointer-events:none;z-index:50;line-height:1.55;font-weight:600;border:1px solid rgba(234,88,12,.4)}
#tap-hint.hidden{display:none}

/* ── Word definition popup ── */
#word-popup-bg{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px}
#word-popup-bg.hidden{display:none}
#word-popup{background:#fff;border:3px solid #EA580C;border-radius:28px;padding:28px 28px 24px;max-width:360px;width:100%;box-shadow:0 12px 48px rgba(0,0,0,.4);animation:popIn .25s cubic-bezier(.34,1.56,.64,1)}
@keyframes popIn{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
#popup-top{display:flex;align-items:center;gap:12px;margin-bottom:16px}
#popup-emoji{font-size:48px}
#popup-word{font-size:30px;font-weight:900;color:#EA580C;line-height:1}
#popup-phonics{font-size:16px;color:#9A3412;font-weight:700;margin-top:4px;letter-spacing:.05em}
.popup-section{border-radius:16px;padding:14px 16px;margin-bottom:12px}
.popup-section-label{font-size:13px;font-weight:800;color:#EA580C;margin-bottom:5px;text-transform:uppercase;letter-spacing:.06em}
.popup-section-text{font-size:17px;line-height:1.6;font-weight:600}
#popup-example-text{font-style:italic;font-weight:400}
#popup-btns{display:flex;gap:10px}
#popup-hear{flex:1;background:#EA580C;border:none;border-radius:16px;color:#fff;font-size:15px;font-weight:800;padding:11px;cursor:pointer;font-family:inherit}
#popup-close{flex:1;background:#FED7AA;border:none;border-radius:16px;color:#EA580C;font-size:15px;font-weight:800;padding:11px;cursor:pointer;font-family:inherit}

/* ── Star burst ── */
#burst-layer{position:fixed;inset:0;pointer-events:none;z-index:9999;overflow:hidden}
.burst-star{position:absolute;opacity:0;animation:sb 1s ease-out forwards}
@keyframes sb{0%{opacity:0;transform:scale(.3)}40%{opacity:1;transform:scale(1.4)}100%{opacity:0;transform:scale(.7) translateY(-40px)}}

/* ── Night mode ── */
body.night{background:#0A0705;color:#FEE0C0}
body.night #header{background:#1C1005}
body.night #player{background:#1C1005;border-top:2px solid #FB923C}
body.night #page-content{background:#140D07;color:#FEE0C0}
body.night #page-nav{background:#140D07}
body.night .nav-btn{background:#431407;color:#FB923C}
body.night #settings-panel{background:#140D07;border-color:#431407}
body.night .setting-label{color:#FB923C}
body.night .speed-btn{border-color:#431407;color:#F97316}
body.night .speed-btn.active{border-color:#FB923C;background:#FB923C;color:#140D07}
body.night .size-btn{border-color:#431407;color:#FB923C}
body.night #voice-select{background:#1C1005;border-color:#431407;color:#FEE0C0}
body.night .voice-hint{color:#F97316}
body.night .book-card{background:#1C1005;border-color:#431407}
body.night .book-card .bmeta{color:#F97316}
body.night .book-card .del-btn{border-color:#431407;color:#F97316}
body.night #library h2{color:#FB923C}
body.night #library .sub{color:#F97316}
body.night #empty-lib{color:#F97316}
body.night #word-popup{background:#1C1005;border-color:#C2410C}
body.night #popup-word{color:#FB923C}
body.night #popup-phonics{color:#F97316}
body.night .popup-section-text{color:#FEE0C0}
body.night #popup-section-def{background:#431407}
body.night #popup-section-ex{background:#140D07;border:1px solid #431407}
body.night #popup-hear{background:#C2410C}
body.night #popup-close{background:#431407;color:#FB923C}
body.night #page-num{color:#F97316}
body.night ::-webkit-scrollbar-thumb{background:#431407}
body.night .word.active{background:#C2410C;color:#FFF7ED}
</style>
</head>
<body>

<div id="app">
  <!-- Header -->
  <div id="header">
    <div id="header-left">
      <button class="hdr-btn" id="back-btn">←</button>
      <span style="font-size:26px;flex-shrink:0">📚</span>
      <div style="min-width:0">
        <div id="book-title">Story Reader</div>
        <div id="book-sub" style="display:none"></div>
      </div>
    </div>
    <div id="header-right">
      <button class="hdr-btn" id="settings-btn" style="display:none">⚙️</button>
      <button class="hdr-btn" id="night-btn">🌙</button>
    </div>
  </div>

  <!-- Settings panel -->
  <div id="settings-panel" class="hidden">
    <div>
      <div class="setting-label">🔊 Speed</div>
      <div class="speed-btns" id="speed-btns"></div>
    </div>
    <div>
      <div class="setting-label">🔤 Text Size</div>
      <div class="size-row">
        <button class="size-btn" id="size-down">A−</button>
        <span id="size-val" style="font-size:13px;font-weight:700;color:#9A3412;min-width:28px;text-align:center">24</span>
        <button class="size-btn" id="size-up">A+</button>
      </div>
    </div>
    <div id="voice-wrap">
      <div class="setting-label">🎙 Voice</div>
      <select id="voice-select"></select>
      <div class="voice-hint">★ = on your device (most natural). Try a few!</div>
    </div>
  </div>

  <!-- Main content area -->
  <div id="main">

    <!-- Library screen -->
    <div id="library">
      <h2>📚 My Book Library</h2>
      <div class="sub" id="lib-count">0 books saved</div>
      <div id="book-list"></div>
      <div id="empty-lib" style="display:none">
        <div class="em">📭</div>
        <div style="font-size:18px;font-weight:700;margin-bottom:8px">No books yet!</div>
        <div style="font-size:14px;opacity:.7">Tap the button below to add your first book.</div>
      </div>
      <label id="add-fab">
        ＋ Add Book
        <input type="file" accept=".pdf,.epub,.mobi,.azw,.azw3,.kfx,.txt" id="lib-file-input">
      </label>
    </div>

    <!-- Loading -->
    <div id="loading" style="display:none">
      <div class="spin">📖</div>
      <div class="msg" id="load-msg">Loading…</div>
    </div>

    <!-- Error -->
    <div id="error-box" class="hidden"></div>

    <!-- Reader screen -->
    <div id="reader" style="display:none">
      <div id="page-content"></div>
      <div id="page-nav">
        <button class="nav-btn" id="prev-btn">◀ Prev</button>
        <span id="page-num">1 / 1</span>
        <button class="nav-btn" id="next-btn">Next ▶</button>
      </div>
    </div>

  </div><!-- /main -->

  <!-- Player bar -->
  <div id="player" style="display:none">
    <label class="c-btn" style="cursor:pointer" title="Open book">
      📂<input type="file" accept=".pdf,.epub,.mobi,.azw,.azw3,.kfx,.txt" id="player-file-input" style="display:none">
    </label>
    <div id="player-center">
      <button class="c-btn" id="p-prev">⏮</button>
      <button id="play-btn">▶ Read to me!</button>
      <button class="c-btn" id="p-stop" style="display:none">⏹</button>
      <button class="c-btn" id="p-next">⏭</button>
    </div>
    <div id="words-badge">⭐<br><span id="word-count">0</span></div>
  </div>

  <!-- Tap hint -->
  <div id="tap-hint" class="hidden">👆 Tap a word to look it up!</div>

  <!-- Word definition popup -->
  <div id="word-popup-bg" class="hidden">
    <div id="word-popup">
      <div id="popup-top">
        <span id="popup-emoji">📖</span>
        <div>
          <div id="popup-word"></div>
          <div id="popup-phonics"></div>
        </div>
      </div>
      <div class="popup-section" id="popup-section-def" style="background:#FED7AA">
        <div class="popup-section-label">What it means</div>
        <div class="popup-section-text" id="popup-def-text"></div>
      </div>
      <div class="popup-section" id="popup-section-ex" style="background:#FFF7ED;border:1px solid #FED7AA">
        <div class="popup-section-label">In a sentence</div>
        <div class="popup-section-text" id="popup-example-text"></div>
      </div>
      <div id="popup-btns">
        <button id="popup-hear">🔊 Hear it</button>
        <button id="popup-close">✓ Got it!</button>
      </div>
    </div>
  </div>

  <!-- Star burst layer -->
  <div id="burst-layer"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

const SYLLABLE_OVERRIDES = {
  beautiful:'beau-ti-ful',everything:'ev-ery-thing',everyone:'ev-ery-one',
  something:'some-thing',anything:'an-y-thing',together:'to-geth-er',
  because:'be-cause',adventure:'ad-ven-ture',suddenly:'sud-den-ly',
  perhaps:'per-haps',princess:'prin-cess',ancient:'an-cient',between:'be-tween',
  beneath:'be-neath',beyond:'be-yond',toward:'to-ward',across:'a-cross',
  above:'a-bove',below:'be-low',mountain:'moun-tain',enormous:'e-nor-mous',
  mysterious:'mys-ter-i-ous',treasure:'treas-ure',journey:'jour-ney',
  kingdom:'king-dom',butterfly:'but-ter-fly',elephant:'el-e-phant',
  unicorn:'u-ni-corn',castle:'cas-tle',always:'al-ways',never:'nev-er',
  magic:'mag-ic',dragon:'drag-on',wizard:'wiz-ard',
};

function syllabify(w) {
  if (SYLLABLE_OVERRIDES[w]) return SYLLABLE_OVERRIDES[w];
  if (w.length <= 3) return w;
  const vowels = 'aeiou';
  let result = '', last = 0;
  for (let i = 1; i < w.length - 1; i++) {
    const pV = vowels.includes(w[i-1]);
    const cC = !vowels.includes(w[i]);
    const nV = vowels.includes(w[i+1]);
    if (pV && cC && nV && i - last >= 2) { result += w.slice(last,i) + '-'; last = i; }
    else if (!vowels.includes(w[i-1]) && cC && nV && i - last >= 3) { result += w.slice(last,i) + '-'; last = i; }
  }
  result += w.slice(last);
  return result.replace(/-([a-z])$/, '$1');
}

function getDefinition(word) {
  const w = word.toLowerCase().replace(/[^a-z]/g,'');
  const entry = DICT[w];
  const phonics = syllabify(w);
  if (entry) return { word:w, phonics, definition:entry.d, example:entry.x, emoji:entry.e };
  return {
    word: w, phonics,
    definition: `"${w}" is a word from your story. Ask a grown-up what it means!`,
    example: `Can you use the word "${w}" in your own sentence?`,
    emoji: '📖',
  };
}

// ── Text helpers ────────────────────────────────────────────────────────────
function cleanText(raw) {
  return raw
    .replace(/\r\n|\r/g,'\n').replace(/[ \t]+/g,' ').replace(/\n{3,}/g,'\n\n')
    .replace(/[\u2018\u2019]/g,"'").replace(/[\u201C\u201D]/g,'"')
    .replace(/\u2014/g,' — ').replace(/\u2013/g,' – ').replace(/\u2026/g,'...')
    .replace(/[^\x20-\x7E\n]/g,' ').trim();
}

function splitSentences(text) {
  return text.replace(/\s+/g,' ').trim()
    .split(/(?<=[.!?]["']?\s)/)
    .map(s=>s.trim()).filter(s=>s.length>1);
}

function tokenize(sentence) {
  return sentence.split(/(\s+)/).filter(Boolean)
    .map(p=>({type:/^\s+$/.test(p)?'space':'word',value:p}));
}

function ttsText(s) {
  return s.replace(/,(\s*)/g,',  ').replace(/;(\s*)/g,';  ')
           .replace(/ — /g,',  ').replace(/\.\.\./g,'...  ');
}

function htmlToText(html) {
  const d = document.createElement('div');
  d.innerHTML = html;
  d.querySelectorAll('script,style,head,nav').forEach(n=>n.remove());
  d.querySelectorAll('p,div,h1,h2,h3,h4,li,br').forEach(n=>n.insertAdjacentText('afterend','\n'));
  return d.textContent||'';
}

// ── File parsers ────────────────────────────────────────────────────────────
async function parsePDF(file) {
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({data:buf}).promise;
  const pages=[];
  for(let p=1;p<=pdf.numPages;p++){
    const pg=await pdf.getPage(p);
    const ct=await pg.getTextContent();
    let lastY=null,txt='';
    ct.items.forEach(it=>{
      const y=it.transform?.[5]??0;
      if(lastY!==null&&Math.abs(y-lastY)>12)txt+='\n';
      txt+=it.str+' '; lastY=y;
    });
    const c=cleanText(txt);
    if(c.length>20)pages.push(c);
  }
  return pages;
}

async function parseEPUB(file) {
  const buf=await file.arrayBuffer();
  const zip=await JSZip.loadAsync(buf);
  const containerXml=await zip.file('META-INF/container.xml')?.async('text');
  if(!containerXml)throw new Error('Not a valid EPUB');
  const opfPath=containerXml.match(/full-path="([^"]+\.opf)"/)?.[1];
  const opfText=await zip.file(opfPath)?.async('text');
  const opfDir=opfPath.includes('/')?opfPath.split('/').slice(0,-1).join('/')+'/':'';
  const parser=new DOMParser();
  const opfDoc=parser.parseFromString(opfText,'text/xml');
  const items={};
  opfDoc.querySelectorAll('manifest item').forEach(i=>items[i.getAttribute('id')]=i.getAttribute('href'));
  const spineIds=[...opfDoc.querySelectorAll('spine itemref')].map(i=>i.getAttribute('idref'));
  const chapters=[];
  for(const id of spineIds){
    const href=items[id];if(!href)continue;
    const html=await zip.file(opfDir+href)?.async('text');if(!html)continue;
    const t=cleanText(htmlToText(html));
    if(t.length>30)chapters.push(t);
  }
  const pages=[];
  for(const ch of chapters){
    if(ch.length<300){if(pages.length)pages[pages.length-1]+='\n'+ch;else pages.push(ch);continue;}
    const paras=ch.split(/\n\n+/);let cur='';
    for(const para of paras){
      if(cur.length+para.length>3000&&cur.length>0){pages.push(cur.trim());cur=para;}
      else cur+=(cur?'\n\n':'')+para;
    }
    if(cur.trim())pages.push(cur.trim());
  }
  return pages;
}

async function parseTXT(file) {
  const t=cleanText(await file.text());
  const paras=t.split(/\n\n+/);const pages=[];let cur='';
  for(const p of paras){
    if(cur.length+p.length>3000&&cur.length>0){pages.push(cur.trim());cur=p;}
    else cur+=(cur?'\n\n':'')+p;
  }
  if(cur.trim())pages.push(cur.trim());
  return pages;
}

async function parseMOBI(file) {
  const buf=await file.arrayBuffer();
  const raw=new TextDecoder('utf-8',{fatal:false}).decode(new Uint8Array(buf));
  const readable=raw.replace(/<[^>]*>/g,' ').replace(/[^\x20-\x7E\n]/g,' ').replace(/\s+/g,' ').trim();
  if(readable.length<100)throw new Error('Could not read this Kindle file. Try converting to EPUB using the free Calibre app first.');
  const pages=[];
  for(let i=0;i<readable.length;i+=3000){
    const c=readable.slice(i,i+3000).trim();
    if(c.length>20)pages.push(c);
  }
  return pages;
}

// ── LocalStorage library persistence ───────────────────────────────────────
function saveLibrary() {
  try { localStorage.setItem('story-reader-library', JSON.stringify(state.books)); } catch(e){}
}
function loadLibrary() {
  try {
    const d = localStorage.getItem('story-reader-library');
    if(d) state.books = JSON.parse(d);
  } catch(e){}
}

// ── Voice loading ───────────────────────────────────────────────────────────
function scoreVoice(v) {
  const n=v.name.toLowerCase();
  if(/neural|enhanced|premium|natural/.test(n)) return 100;
  if(/samantha|karen|daniel|moira|fiona|tessa/.test(n)) return 90;
  if(/aria|jenny|libby|sonia|ryan|clara|guy/.test(n)) return 88;
  if(/google uk english female/.test(n)) return 85;
  if(/google uk english male/.test(n)) return 82;
  if(/google us english/.test(n)) return 78;
  if(v.localService&&v.lang.startsWith('en')) return 60;
  if(v.lang.startsWith('en')) return 40;
  return 0;
}
function loadVoices() {
  const all = speechSynthesis.getVoices().filter(v=>v.lang.startsWith('en'))
    .sort((a,b)=>scoreVoice(b)-scoreVoice(a));
  state.allVoices = all;
  currentVoice = all[state.voiceIdx]||null;
  const sel = document.getElementById('voice-select');
  sel.innerHTML = '';
  all.forEach((v,i)=>{
    const o=document.createElement('option');
    o.value=i; o.textContent=`${v.name} (${v.lang})${v.localService?' ★':''}`;
    sel.appendChild(o);
  });
  sel.value = state.voiceIdx;
}

// ── TTS ────────────────────────────────────────────────────────────────────
function speakSentence(pIdx, sIdx) {
  speechSynthesis.cancel();
  const pageText = state.pages[pIdx]||'';
  const sents = splitSentences(pageText);
  if(sIdx>=sents.length){
    const next=pIdx+1;
    if(next<state.pages.length){
      state.pageIndex=next; pageIdxNow=next;
      updateLastPage(next);
      renderPage();
      updatePageNav();
      setTimeout(()=>{ if(readingActive) speakSentence(next,0); },600);
    } else {
      readingActive=false;
      state.isReading=false; state.isPaused=false;
      updatePlayBtn();
      showBurst();
    }
    return;
  }
  state.activeSentIdx=sIdx; sentIdxNow=sIdx;
  const toks=tokenize(sents[sIdx]);
  const words=toks.filter(t=>t.type==='word').map(t=>t.value);
  if(!words.length){ speakSentence(pIdx,sIdx+1); return; }

  const utter=new SpeechSynthesisUtterance(ttsText(words.join(' ')));
  utter.rate=currentSpeed.rate; utter.pitch=currentSpeed.pitch;
  if(currentVoice) utter.voice=currentVoice;

  utter.onboundary=(e)=>{
    if(e.name!=='word') return;
    let cc=0;
    for(let i=0;i<words.length;i++){
      if(cc>=e.charIndex){
        highlightWord(sIdx,i);
        state.wordsRead++;
        document.getElementById('word-count').textContent=state.wordsRead;
        break;
      }
      cc+=words[i].length+1;
    }
  };
  utter.onend=()=>{
    if(!readingActive||pausedFlag)return;
    clearHighlight();
    speakSentence(pIdx,sIdx+1);
  };
  utter.onerror=(e)=>{
    if(e.error==='interrupted'||e.error==='canceled')return;
    if(readingActive) speakSentence(pIdx,sIdx+1);
  };
  speechSynthesis.speak(utter);
}

function startReading(){
  if(!state.pages.length)return;
  readingActive=true; pausedFlag=false;
  state.isReading=true; state.isPaused=false;
  updatePlayBtn();
  hideTapHint();
  speakSentence(state.pageIndex, state.activeSentIdx>=0?state.activeSentIdx:0);
}
function pauseReading(){
  speechSynthesis.pause(); pausedFlag=true;
  state.isPaused=true; updatePlayBtn();
}
function resumeReading(){
  speechSynthesis.resume(); pausedFlag=false;
  state.isPaused=false; updatePlayBtn();
}
function stopReading(){
  readingActive=false; pausedFlag=false;
  speechSynthesis.cancel();
  state.isReading=false; state.isPaused=false;
  state.activeSentIdx=-1; state.activeWordIdx=-1;
  clearHighlight(); updatePlayBtn();
  showTapHint();
}

function highlightWord(si, wi) {
  clearHighlight();
  state.activeSentIdx=si; state.activeWordIdx=wi;
  const el=wordEls[`${si}-${wi}`];
  if(el){
    el.classList.add('active');
    el.scrollIntoView({behavior:'smooth',block:'nearest'});
  }
}
function clearHighlight(){
  document.querySelectorAll('.word.active').forEach(el=>el.classList.remove('active'));
}

// ── Page rendering ──────────────────────────────────────────────────────────
function renderPage(){
  const content=document.getElementById('page-content');
  content.style.fontSize=state.fontSize+'px';
  wordEls={};
  const text=state.pages[state.pageIndex]||'';
  const sents=splitSentences(text);
  let html='';
  sents.forEach((sent,si)=>{
    const toks=tokenize(sent);
    let wi=-1;
    toks.forEach(tok=>{
      if(tok.type==='space'){html+=tok.value.replace(/\n\n/g,'<br><br>').replace(/\n/g,' ');}
      else{
        wi++;
        const clean=tok.value.toLowerCase().replace(/[^a-z]/g,'');
        html+=`<span class="word" data-si="${si}" data-wi="${wi}" data-word="${clean}">${tok.value}</span>`;
      }
    });
  });
  content.innerHTML=html;
  // Register word elements and click handlers
  content.querySelectorAll('.word').forEach(el=>{
    const si=+el.dataset.si, wi=+el.dataset.wi;
    wordEls[`${si}-${wi}`]=el;
    el.addEventListener('click',()=>{
      const w=el.dataset.word;
      if(w&&w.length>=2) showWordPopup(w);
    });
  });
}

function updatePageNav(){
  document.getElementById('page-num').textContent=`${state.pageIndex+1} / ${state.pages.length}`;
  document.getElementById('prev-btn').disabled=state.pageIndex===0;
  document.getElementById('next-btn').disabled=state.pageIndex===state.pages.length-1;
  document.getElementById('p-prev').disabled=state.pageIndex===0;
  document.getElementById('p-next').disabled=state.pageIndex===state.pages.length-1;
}

function goPage(dir){
  stopReading();
  const next=state.pageIndex+dir;
  if(next<0||next>=state.pages.length)return;
  state.pageIndex=next; pageIdxNow=next;
  updateLastPage(next);
  renderPage(); updatePageNav();
}

// ── Book library ────────────────────────────────────────────────────────────
function updateLastPage(p){
  if(!state.activeBook)return;
  state.books=state.books.map(b=>b.id===state.activeBook.id?{...b,lastPage:p}:b);
  saveLibrary();
}

function renderLibrary(){
  const list=document.getElementById('book-list');
  const empty=document.getElementById('empty-lib');
  document.getElementById('lib-count').textContent=`${state.books.length} book${state.books.length!==1?'s':''} saved`;
  if(!state.books.length){list.innerHTML='';empty.style.display='block';return;}
  empty.style.display='none';
  const icons=['📗','📘','📙','📕','📓'];
  list.innerHTML=state.books.map((b,i)=>`
    <div class="book-card" data-id="${b.id}">
      <div class="icon">${icons[i%5]}</div>
      <div class="info">
        <div class="btitle">${b.title}</div>
        <div class="bmeta">${b.pages} pages · Added ${new Date(b.addedAt).toLocaleDateString()}</div>
        ${b.lastPage>0?`<div class="badge">📖 Page ${b.lastPage+1}</div>`:''}
      </div>
      <button class="del-btn" data-del="${b.id}">🗑</button>
    </div>
  `).join('');

  list.querySelectorAll('.book-card').forEach(card=>{
    card.addEventListener('click', e=>{
      if(e.target.dataset.del)return;
      const id=card.dataset.id;
      const meta=state.books.find(b=>b.id===id);
      if(meta) openBook(meta);
    });
  });
  list.querySelectorAll('.del-btn').forEach(btn=>{
    btn.addEventListener('click', e=>{
      e.stopPropagation();
      const id=btn.dataset.del;
      state.books=state.books.filter(b=>b.id!==id);
      delete state.bookContents[id];
      saveLibrary();
      renderLibrary();
    });
  });
}

function openBook(meta){
  const content=state.bookContents[meta.id];
  if(!content||!content.length){
    showError('Book content not found. Please re-add the file using ＋ Add Book.');
    return;
  }
  stopReading();
  state.activeBook=meta;
  state.pages=content;
  state.pageIndex=meta.lastPage||0;
  pageIdxNow=state.pageIndex;
  state.wordsRead=0;
  document.getElementById('word-count').textContent='0';
  setScreen('reader');
  renderPage();
  updatePageNav();
}

// ── File processing ─────────────────────────────────────────────────────────
async function processFile(file){
  if(!file)return;
  stopReading();
  hideError();
  showLoading('Opening book…');
  try{
    const name=file.name.toLowerCase();
    let pages=[];
    if(name.endsWith('.pdf')){ setLoadMsg('Reading PDF…'); pages=await parsePDF(file); }
    else if(name.endsWith('.epub')){ setLoadMsg('Unpacking EPUB…'); pages=await parseEPUB(file); }
    else if(name.endsWith('.txt')||name.endsWith('.text')){ setLoadMsg('Reading text…'); pages=await parseTXT(file); }
    else if(/\.(mobi|azw|azw3|kfx)$/.test(name)){ setLoadMsg('Reading Kindle file…'); pages=await parseMOBI(file); }
    else throw new Error('Unsupported format. Use PDF, EPUB, MOBI, AZW, AZW3 or TXT.');
    if(!pages.length)throw new Error('No readable text found in this file.');

    const id=`book_${Date.now()}`;
    const title=file.name.replace(/\.[^.]+$/,'').replace(/[-_]/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
    const meta={id,title,pages:pages.length,addedAt:Date.now(),lastPage:0};
    state.books.push(meta);
    state.bookContents[id]=pages;
    saveLibrary();
    hideLoading();
    openBook(meta);
    renderLibrary();
  }catch(e){
    hideLoading();
    showError(e.message||'Could not read this file.');
  }
}

// ── Word popup ──────────────────────────────────────────────────────────────
let popupWord='';
function showWordPopup(word){
  stopReading();
  popupWord=word;
  const def=getDefinition(word);
  document.getElementById('popup-emoji').textContent=def.emoji;
  document.getElementById('popup-word').textContent=def.word;
  document.getElementById('popup-phonics').textContent='🔤 '+def.phonics;
  document.getElementById('popup-def-text').textContent=def.definition;
  document.getElementById('popup-example-text').textContent=def.example;
  document.getElementById('word-popup-bg').classList.remove('hidden');
  // Speak word
  const u=new SpeechSynthesisUtterance(def.word);
  u.rate=0.65; u.pitch=1.1;
  if(currentVoice)u.voice=currentVoice;
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}
function hideWordPopup(){
  document.getElementById('word-popup-bg').classList.add('hidden');
  speechSynthesis.cancel();
}

// ── Star burst ──────────────────────────────────────────────────────────────
function showBurst(){
  const layer=document.getElementById('burst-layer');
  layer.innerHTML='';
  const stars=['⭐','🌟','✨','💫','🎉','🎊','🌈','❤️'];
  for(let i=0;i<18;i++){
    const a=(i/18)*360, d=70+Math.random()*140;
    const x=50+Math.cos(a*Math.PI/180)*d*0.4;
    const y=45+Math.sin(a*Math.PI/180)*d*0.22;
    const el=document.createElement('div');
    el.className='burst-star';
    el.style.cssText=`left:${x}%;top:${y}%;font-size:${18+Math.random()*20}px;animation-delay:${i*40}ms`;
    el.textContent=stars[i%8];
    layer.appendChild(el);
  }
  setTimeout(()=>layer.innerHTML='',1200);
}

// ── Screen management ───────────────────────────────────────────────────────
function setScreen(s){
  state.screen=s;
  document.getElementById('library').style.display=s==='library'?'':'none';
  document.getElementById('reader').style.display=s==='reader'?'flex':'none';
  document.getElementById('player').style.display=s==='reader'?'flex':'none';
  document.getElementById('back-btn').style.display=s==='reader'?'flex':'none';
  document.getElementById('settings-btn').style.display=s==='reader'?'flex':'none';
  if(s==='library'){
    document.getElementById('book-title').textContent='Story Reader';
    document.getElementById('book-sub').style.display='none';
    document.getElementById('settings-panel').classList.add('hidden');
    renderLibrary();
  } else {
    document.getElementById('book-title').textContent=state.activeBook?.title||'Reading';
    document.getElementById('book-sub').style.display='block';
    updateBookSub();
    showTapHint();
  }
}

function updateBookSub(){
  document.getElementById('book-sub').textContent=
    `Page ${state.pageIndex+1}/${state.pages.length} · ⭐ ${state.wordsRead}`;
}

function updatePlayBtn(){
  const btn=document.getElementById('play-btn');
  const stop=document.getElementById('p-stop');
  if(!state.isReading){ btn.textContent='▶ Read to me!'; stop.style.display='none'; }
  else if(state.isPaused){ btn.textContent='▶ Continue'; stop.style.display='flex'; }
  else{ btn.textContent='⏸ Pause'; stop.style.display='flex'; }
  updateBookSub();
}

function showTapHint(){ document.getElementById('tap-hint').classList.remove('hidden'); }
function hideTapHint(){ document.getElementById('tap-hint').classList.add('hidden'); }
function showLoading(msg){ document.getElementById('loading').style.display='flex'; setLoadMsg(msg); }
function hideLoading(){ document.getElementById('loading').style.display='none'; }
function setLoadMsg(m){ document.getElementById('load-msg').textContent=m; }
function showError(m){ const b=document.getElementById('error-box'); b.textContent='⚠️ '+m; b.classList.remove('hidden'); }
function hideError(){ document.getElementById('error-box').classList.add('hidden'); }

// ── Night mode ──────────────────────────────────────────────────────────────
function toggleNight(){
  state.nightMode=!state.nightMode;
  document.body.classList.toggle('night',state.nightMode);
  document.getElementById('night-btn').textContent=state.nightMode?'☀️':'🌙';
  document.querySelector('meta[name="theme-color"]').content=state.nightMode?'#1C1005':'#EA580C';
}

// ── Settings ─────────────────────────────────────────────────────────────────
function buildSpeedBtns(){
  const wrap=document.getElementById('speed-btns');
  wrap.innerHTML='';
  SPEEDS.forEach((s,i)=>{
    const btn=document.createElement('button');
    btn.className='speed-btn'+(i===state.speedIdx?' active':'');
    btn.textContent=s.label;
    btn.addEventListener('click',()=>{
      state.speedIdx=i; currentSpeed=SPEEDS[i];
      wrap.querySelectorAll('.speed-btn').forEach((b,j)=>b.classList.toggle('active',j===i));
      if(state.isReading&&!state.isPaused){
        const si=sentIdxNow,pi=pageIdxNow;
        stopReading();
        setTimeout(()=>{readingActive=true;pausedFlag=false;state.isReading=true;state.isPaused=false;updatePlayBtn();speakSentence(pi,si);},100);
      }
    });
    wrap.appendChild(btn);
  });
}

// ── Event listeners ──────────────────────────────────────────────────────────
document.getElementById('back-btn').addEventListener('click',()=>{stopReading();setScreen('library');});
document.getElementById('night-btn').addEventListener('click',toggleNight);
document.getElementById('settings-btn').addEventListener('click',()=>{
  document.getElementById('settings-panel').classList.toggle('hidden');
});
document.getElementById('play-btn').addEventListener('click',()=>{
  if(!state.isReading) startReading();
  else if(state.isPaused) resumeReading();
  else pauseReading();
});
document.getElementById('p-stop').addEventListener('click',stopReading);
document.getElementById('prev-btn').addEventListener('click',()=>goPage(-1));
document.getElementById('next-btn').addEventListener('click',()=>goPage(1));
document.getElementById('p-prev').addEventListener('click',()=>goPage(-1));
document.getElementById('p-next').addEventListener('click',()=>goPage(1));
document.getElementById('lib-file-input').addEventListener('change',e=>processFile(e.target.files?.[0]));
document.getElementById('player-file-input').addEventListener('change',e=>processFile(e.target.files?.[0]));
document.getElementById('word-popup-bg').addEventListener('click',e=>{if(e.target===e.currentTarget)hideWordPopup();});
document.getElementById('popup-close').addEventListener('click',hideWordPopup);
document.getElementById('popup-hear').addEventListener('click',()=>{
  const u=new SpeechSynthesisUtterance(popupWord);
  u.rate=0.65;u.pitch=1.1;if(currentVoice)u.voice=currentVoice;
  speechSynthesis.cancel();speechSynthesis.speak(u);
});
document.getElementById('size-down').addEventListener('click',()=>{
  state.fontSize=Math.max(16,state.fontSize-2);
  document.getElementById('size-val').textContent=state.fontSize;
  if(state.pages.length)renderPage();
});
document.getElementById('size-up').addEventListener('click',()=>{
  state.fontSize=Math.min(44,state.fontSize+2);
  document.getElementById('size-val').textContent=state.fontSize;
  if(state.pages.length)renderPage();
});
document.getElementById('voice-select').addEventListener('change',e=>{
  state.voiceIdx=+e.target.value;
  currentVoice=state.allVoices[state.voiceIdx]||null;
});

// ── Boot ─────────────────────────────────────────────────────────────────────
loadLibrary();
buildSpeedBtns();
currentSpeed=SPEEDS[state.speedIdx];
renderLibrary();
setScreen('library');

speechSynthesis.onvoiceschanged=loadVoices;
loadVoices();
setTimeout(loadVoices,500); // fallback for some browsers

// Register service worker
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js')
      .then(()=>console.log('SW registered'))
      .catch(e=>console.log('SW failed:',e));
  });
}
</script>
